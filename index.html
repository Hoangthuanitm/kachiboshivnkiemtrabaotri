<style>
:root{--g:#2F6D42;--g2:#24563A;--gl:#E7F1EA;--y:#EDE34C;--yl:#FBF7C9;--r:#C62828;--rl:#FDECEA;--a:#B26A00;--al:#FFF4D6;--o:#D84315;--ol:#FBE9E7;--tx:#1d2420;--mu:#5f6b63;--bd:#dde3de;--bg:#f3f5f2;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;max-width:100%;overflow-x:clip}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans JP","Hiragino Sans",sans-serif;background:var(--bg);color:var(--tx);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:17px;width:100%;max-width:100%;min-width:0;padding:12px 12px;border:1.5px solid var(--bd);border-radius:12px;background:#fff;min-height:52px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 3px rgba(47,109,66,.15)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* Header */
.top{position:sticky;top:0;z-index:30;background:var(--g);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));box-shadow:0 2px 8px rgba(0,0,0,.12)}
.top .lg{width:40px;height:40px;border-radius:10px;background:#fff;object-fit:contain;padding:2px}
.top .ttl{flex:1;min-width:0;line-height:1.15}
.top .ttl b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{display:block;opacity:.85;font-size:12.5px;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;min-width:44px;height:44px;display:flex;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:14px;padding:0 10px;cursor:pointer}
.dot{width:10px;height:10px;border-radius:50%;background:#7CFC9A;box-shadow:0 0 0 2px rgba(255,255,255,.4)}
.dot.off{background:#ff8a80}
/* Layout */
main{max-width:760px;margin:0 auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom))}
h2{font-size:21px;margin:4px 0 12px}
h3{font-size:17px;margin:18px 0 8px;color:var(--g2)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.mu{color:var(--mu)} .sm{font-size:14px} .b{font-weight:700}
.row{display:flex;align-items:center;gap:10px} .row>.f{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.lc{min-width:0;margin-bottom:12px} .lc>label{display:block;font-weight:600;font-size:15px;margin:0 0 5px}
.req:after{content:" *";color:var(--r)}
/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border:0;border-radius:14px;font-size:18px;font-weight:700;cursor:pointer;padding:10px 16px;background:var(--g);color:#fff;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn.y{background:var(--y);color:#2a2a00}.btn.r{background:var(--r)}.btn.w{background:#fff;color:var(--g2);border:1.5px solid var(--bd)}.btn.gh{background:var(--gl);color:var(--g2)}
.btn.sm{min-height:46px;font-size:16px;width:auto;border-radius:12px}
.btn[disabled]{opacity:.5}
.bigscan{min-height:116px;font-size:24px;border-radius:20px;flex-direction:column;gap:6px;box-shadow:0 6px 18px rgba(47,109,66,.3)}
.bigscan svg.i{width:46px;height:46px}
.btns{display:flex;gap:10px;flex-wrap:wrap}.btns>.btn{flex:1 1 140px}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
.kpi{border-radius:16px;padding:14px 8px;text-align:center;border:0;cursor:pointer;color:#fff;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.kpi b{font-size:38px;line-height:1}.kpi span{font-size:15px;font-weight:700;margin-top:6px}
.kpi.r{background:var(--r)}.kpi.a{background:#E0A100;color:#2b2000}.kpi.g{background:var(--g)}
.kpi.zero{opacity:.55}
.brokebar{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;border:0;border-radius:14px;background:var(--rl);color:var(--r);font-weight:800;font-size:17px;padding:10px 14px;margin-bottom:10px;cursor:pointer;text-align:left}
.it.ap .t2{white-space:normal}
.brokebar.pendbar{background:var(--al);color:var(--a)}
.brokebar small{font-weight:600;color:#8a3b3b}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:12px}
.stat b{font-size:26px;display:block}.stat span{font-size:14px;color:var(--mu)}
/* Lists */
.it{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--bd);border-left:6px solid var(--g);border-radius:14px;padding:12px;margin-bottom:10px;cursor:pointer;min-height:68px}
.it.r{border-left-color:var(--r)}.it.a{border-left-color:#E0A100}.it.m{border-left-color:#9aa39d}.it.o{border-left-color:var(--o)}
.it .f{flex:1;min-width:0}.it .t1{font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .t2{font-size:14px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;letter-spacing:.3px}
input.code::placeholder,#lid::placeholder{text-transform:none;font-family:system-ui,sans-serif;font-weight:400;letter-spacing:0}
.btns>.btn{padding:10px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.chip.g{background:var(--gl);color:var(--g2)}.chip.r{background:var(--rl);color:var(--r)}.chip.a{background:var(--al);color:var(--a)}.chip.m{background:#eceeec;color:#555}.chip.o{background:var(--ol);color:var(--o)}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
.empty svg.i{width:44px;height:44px;stroke:#b8c2bb}
/* Tabs / segmented */
.tabs{display:flex;gap:6px;background:#e6ebe7;border-radius:14px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;white-space:nowrap;padding:0 4px;border:0;background:transparent;border-radius:10px;min-height:46px;font-weight:700;font-size:15px;cursor:pointer;color:var(--mu)}
.tabs button.on{background:#fff;color:var(--g2);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tabs button .n{display:inline-block;min-width:22px;border-radius:11px;background:var(--r);color:#fff;font-size:12px;padding:1px 6px;margin-left:4px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{flex:1 1 90px;min-height:56px;border:2px solid var(--bd);background:#fff;border-radius:14px;font-weight:700;font-size:16px;cursor:pointer;padding:6px}
.opt.on{border-color:var(--g);background:var(--gl);color:var(--g2)}
.opt.on.r{border-color:var(--r);background:var(--rl);color:var(--r)}.opt.on.a{border-color:#E0A100;background:var(--al);color:var(--a)}.opt.on.o{border-color:var(--o);background:var(--ol);color:var(--o)}
.res{min-height:72px;font-size:20px}
/* Checklist */
.ck{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer;min-height:60px;font-size:17px;user-select:none}
.ck .bx{width:32px;height:32px;border-radius:9px;border:2.5px solid #9aa39d;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.ck.on{border-color:var(--g);background:var(--gl)}.ck.on .bx{background:var(--g);border-color:var(--g)}
.ck .bx svg.i{width:22px;height:22px;stroke-width:3;opacity:0}.ck.on .bx svg.i{opacity:1}
/* Photos */
.phs{display:flex;gap:8px;flex-wrap:wrap}
.ph{position:relative;width:96px;height:96px;border-radius:12px;overflow:hidden;background:#e9ece9;border:1px solid var(--bd)}
.ph img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.ph .x{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center}
.ph .x svg.i{width:16px;height:16px}
.phadd{width:96px;height:96px;border-radius:12px;border:2px dashed #9fb3a5;background:#f7faf7;color:var(--g2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:700;cursor:pointer;gap:4px}
.phload{width:96px;height:96px;border-radius:12px;background:#e9ece9;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--mu);text-align:center;padding:6px;cursor:pointer}
/* Nav */
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 10px rgba(0,0,0,.06)}
nav.bn button{flex:1;border:0;background:none;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12.5px;font-weight:700;color:#7a857e;cursor:pointer;position:relative;padding:4px 2px}
nav.bn button svg.i{width:26px;height:26px}
nav.bn button.on{color:var(--g)}
nav.bn button.on:before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--g)}
nav.bn .bd{position:absolute;top:6px;left:calc(50% + 6px);background:var(--r);color:#fff;border-radius:10px;font-size:11px;min-width:20px;padding:1px 5px;line-height:16px}
/* Misc */
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:13px 18px;border-radius:14px;font-weight:600;z-index:90;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25);display:none;text-align:center}
.toast.ok{background:var(--g2)}.toast.err{background:var(--r)}
.busy{position:fixed;inset:0;background:rgba(255,255,255,.6);z-index:95;display:none;align-items:center;justify-content:center}
.spin{width:46px;height:46px;border-radius:50%;border:5px solid var(--gl);border-top-color:var(--g);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.boot{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
.boot img{width:150px}
.login{max-width:420px;margin:0 auto;padding:28px 18px}
.login .logo{display:block;width:150px;margin:6px auto 4px}
.login h1{text-align:center;font-size:22px;margin:6px 0 2px;color:var(--g2)}
.login .sub{text-align:center;color:var(--mu);margin-bottom:22px}
.pin{letter-spacing:8px;font-size:24px;text-align:center}
.foot{text-align:center;color:#8a948d;font-size:12.5px;margin:20px 0 6px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;display:flex;align-items:center;justify-content:center;overflow:auto}
.lb img{max-width:100%;max-height:100%;transition:transform .2s}
.lb.z img{max-width:none;max-height:none;width:200%}
.scan{position:fixed;inset:0;background:#000;z-index:80;display:flex;flex-direction:column;color:#fff}
.scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan .frame{position:absolute;left:50%;top:42%;width:min(70vw,300px);height:min(70vw,300px);transform:translate(-50%,-50%);border-radius:22px;box-shadow:0 0 0 2000px rgba(0,0,0,.45);border:4px solid var(--y)}
.scan .bar{position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:12px;padding-top:calc(12px + env(safe-area-inset-top))}
.scan .msg{position:absolute;left:0;right:0;top:calc(42% + min(35vw,150px) + 18px);text-align:center;font-weight:700;font-size:18px;z-index:2;padding:0 20px;text-shadow:0 1px 4px #000}
.scan .man{position:absolute;left:0;right:0;bottom:0;z-index:2;background:#fff;color:var(--tx);border-radius:20px 20px 0 0;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.menu .it{border-left-width:1px}
.menu .it svg.i{color:var(--g)}
.info{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:15.5px}
.info dt{color:var(--mu)}.info dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.devhead{display:flex;gap:12px;align-items:flex-start}
.devhead .qrm{width:84px;height:84px;flex:none;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:5px}
.devhead .qrm svg{width:100%;height:100%}
.search{position:relative}.search svg.i{position:absolute;left:12px;top:15px;color:var(--mu)}.search input{padding-left:42px}
.scroll{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t td,table.t th{border-bottom:1px solid var(--bd);padding:8px 6px;text-align:left}
.sel{width:30px;height:30px;border-radius:8px;border:2.5px solid #9aa39d;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.sel.on{background:var(--g);border-color:var(--g)}
.sel svg.i{width:20px;height:20px;stroke-width:3}
.nl{padding:10px 0;border-bottom:1px solid var(--bd)}.nl:last-child{border-bottom:0}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.prow{display:flex;gap:8px;margin-bottom:8px;align-items:center}.prow .pn{flex:1;min-width:0}.prow .pq{width:84px;flex:none;text-align:center}
.btn.px{width:52px;min-height:52px;padding:0;flex:none;color:var(--r)}
/* Máy đan */
.fchips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.fc{border:1.5px solid var(--bd);background:#fff;border-radius:999px;min-height:42px;padding:0 14px;font-weight:700;font-size:15px;cursor:pointer;color:var(--tx)}
.fc span{display:inline-block;min-width:22px;border-radius:11px;background:#eceeec;color:var(--mu);font-size:12px;padding:1px 6px;margin-left:4px}
.fc.on{border-color:var(--g);background:var(--g);color:#fff}.fc.on span{background:rgba(255,255,255,.25);color:#fff}
.fc.pc{font-family:ui-monospace,Menlo,Consolas,monospace}
.knbar{border:1.5px solid #e6dc7a}
@media (min-width:700px){.knbar{position:sticky;top:64px;z-index:5;box-shadow:0 4px 12px rgba(0,0,0,.08)}}
.knt{flex:1 1 140px;min-width:0;font-size:17px}
.kncount{display:inline-block;border-radius:14px;background:#fff;border:1.5px solid var(--g);color:var(--g2);font-size:14px;padding:1px 10px;margin-left:6px}
@media (max-width:699px){
  #knsave{position:fixed;left:12px;right:12px;width:auto;bottom:calc(74px + env(safe-area-inset-bottom));z-index:20;box-shadow:0 6px 18px rgba(0,0,0,.25)}
  main.v-knit{padding-bottom:170px}
}
.stepn{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--g);color:#fff;font-size:13px;margin-right:8px}
.prodband{background:var(--y);color:#2a2a00;padding:6px 12px 7px;display:flex;flex-direction:column;justify-content:center;min-height:52px}
.prodband small{font-size:11px;font-weight:600;opacity:.75;line-height:1.2}
.prodband b{font-size:16px;line-height:1.2;letter-spacing:.2px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prodband b.sm{font-size:14px}.prodband b.xs{font-size:12.5px;-webkit-line-clamp:3}
.prodband.none{background:#eceeec;color:var(--mu)}.prodband.none b{font-weight:600;font-size:14px}
.gbadge{position:absolute;left:8px;bottom:8px;background:var(--g2);color:#fff;font-weight:800;font-size:13px;border-radius:8px;padding:2px 8px}
.dt .pic{position:relative}
/* Thiết bị dạng ô */
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:700px){.dgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1000px){.dgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:900px){main.v-devices{max-width:1180px}}
.dt{position:relative;background:#fff;border:1.5px solid var(--bd);border-radius:16px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .1s}
.dt:active{transform:scale(.98)}
.dt .pic{height:104px;display:flex;align-items:center;justify-content:center;background:var(--gl)}
.dt.broken{border-color:#f0b9b9}.dt.broken .pic{background:var(--rl)}
.dt.off{opacity:.7}.dt.off .pic{background:#eceeec}

.dt.broken .mimg{filter:hue-rotate(205deg) saturate(1.6) brightness(1.05)}
.dt.off .mimg{filter:grayscale(1) brightness(1.1)}
.dt .dst{position:absolute;top:8px;right:8px;z-index:1}.dt .dst .chip{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.dt .sel{position:absolute;top:8px;left:8px;background:#fff}
.dt.picked{border-color:var(--g);box-shadow:0 0 0 2px var(--g)}
.dtb{padding:10px 12px 12px}
.dcd{font-size:17px}
.dnm{font-weight:600;font-size:15px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dmeta{font-size:13px;color:var(--mu);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hl{background:var(--yl);border-radius:12px;padding:10px 12px;font-size:15px;margin-bottom:12px}
/* Labels */
#print-area{display:none}
.sheet{display:flex;flex-wrap:wrap;gap:3mm;background:#fff}
.lbl{border:0.3mm dashed #999;display:flex;align-items:center;gap:2mm;padding:2mm;background:#fff;color:#000;overflow:hidden;font-family:Arial,"Noto Sans JP",sans-serif;break-inside:avoid;page-break-inside:avoid}
.lbl .q svg{width:100%;height:100%;display:block}
.lbl .tx{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.lbl .br{display:flex;align-items:center;gap:1mm;font-weight:800;color:#2F6D42;white-space:nowrap}
.lbl .br img{object-fit:contain}
.lbl .cd{font-weight:900;font-family:Arial,sans-serif;line-height:1.05;white-space:nowrap;letter-spacing:-.2px}
.lbl .nm,.lbl .ar{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbl.s50{width:50mm;height:30mm}.lbl.s50{gap:1.5mm;padding:1.5mm}.lbl.s50 .q{width:24mm;height:24mm;flex:none}.lbl.s50 .br{font-size:5pt}.lbl.s50 .br img{width:3.5mm;height:3.5mm}.lbl.s50 .cd{font-size:8.5pt;margin:1mm 0}.lbl.s50 .nm{font-size:6.5pt}.lbl.s50 .ar{font-size:5.5pt;color:#333}
.lbl.s70{width:70mm;height:50mm;gap:3mm;padding:3mm}.lbl.s70 .q{width:38mm;height:38mm;flex:none}.lbl.s70 .br{font-size:6.5pt}.lbl.s70 .br img{width:6mm;height:6mm}.lbl.s70 .cd{font-size:11pt;margin:1.5mm 0}.lbl.s70 .nm{font-size:8pt;white-space:normal;max-height:7.5mm}.lbl.s70 .ar{font-size:7pt;color:#333}
.vbars{display:flex;align-items:flex-end;gap:8px;height:150px;margin-top:10px;padding-bottom:22px;border-bottom:1px solid var(--bd);position:relative}
.vb{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative;cursor:default}
.vb i{display:block;width:min(34px,70%);background:#E7A3A3;border-radius:4px 4px 0 0}
.vb.on i{background:var(--r)}
.vb .v{font-size:13px;font-weight:700;margin-bottom:3px}
.vb .l{position:absolute;bottom:-21px;font-size:12px;color:var(--mu);white-space:nowrap}
.vb.on .l{color:var(--tx);font-weight:700}
.hb2{padding:7px 0;cursor:pointer}
.hb2 .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px}
.hb2 .tr{height:10px;background:#f1e3e3;border-radius:5px;margin-top:5px;overflow:hidden}
.hb2 .tr i{display:block;height:100%;background:var(--r);border-radius:0 5px 5px 0}
table.t th.n,table.t td.n{text-align:right}
table.t th{font-size:13px;color:var(--mu);font-weight:600}
.prev{background:#e9ece9;border-radius:14px;padding:12px;overflow:auto;max-height:60vh}
@media print{
  @page{size:A4;margin:8mm}
  body{background:#fff;padding:0}
  body>*:not(#print-area){display:none!important}
  #print-area{display:block!important}
  .lbl{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (min-width:700px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.h3top{margin-top:18px}
.rgrid{margin-top:14px}
</style>

/* ================== DANH MỤC ================== */
const ROLES = {admin:"Quản trị", manager:"Quản đốc", leader:"Tổ trưởng", worker:"Công nhân"};
const DSTATUS = {ok:["Hoạt động","g","ok"], off:["Ngừng dùng","m","off"]};
/* Tình trạng sự cố: chỉ 2 trạng thái. Dữ liệu cũ (open/doing/fixing/broken) đều = Đang hỏng */
const ISTATUS = {open:["Đang hỏng","r"], done:["Đã sửa xong","g"]};
const iSt = i => i.status === "done" ? "done" : "open";
const waitDays = i => daysBetween(i.date || ymd(new Date(i.at)), today());
const UNITS = {day:"ngày", week:"tuần", month:"tháng", year:"năm", once:"1 lần"};
const DEF_CFG = {areas:["Xưởng Đan","Xưởng PVC","Xưởng Cao su","Xưởng May","Kho","Văn phòng"], kinds:["Vệ sinh","Tra dầu mỡ","Kiểm tra điện","Kiểm tra tổng quát","Thay thế linh kiện"],
  groups:["Máy đan","Máy in PVC","Máy nhúng cao su","Lò sấy / lò lưu hoá","Máy may","Máy nén khí","Nồi hơi","Xe nâng","Máy đóng gói","Khác"],
  depts:["Bảo trì","Đan","PVC","Cao su","May","Kho"],
  products:[],
  parts:["Kim đan","Lưỡi gà","Lò xo kim","Dây curoa","Bạc đạn","Motor","Cảm biến","Rơ-le nhiệt","Phớt bơm","Kim may","Dao cắt","Lọc gió","Xích tải","Khuôn tay"]};
const GAUGES = ["7G","8G","10G","13G","15G"];                       // loại máy đan
const isKnit = g => String(g || "").trim().toLowerCase() === "máy đan";
const groupLabel = d => d && d.group ? d.group + (d.gauge ? " " + d.gauge : "") : "";
const chip = (t, c) => '<span class="chip ' + c + '">' + esc(T(t)) + '</span>';
/* Trạng thái máy không nhập tay: "Đang hỏng" khi còn sự cố chưa sửa xong */
function devState(d){
  if (!d) return DSTATUS.ok;
  if (d.status === "off") return DSTATUS.off;
  const inc = Object.values(S.incOpen).filter(i => i.devId === d._id);
  if (inc.length) return ["Đang hỏng", "r", "broken"];
  return DSTATUS.ok;
}
const dChip = d => { const x = devState(d); return chip(x[0], x[1]); };

/* ================== FIRESTORE ================== */
/* Mọi dữ liệu nằm trong 1 collection; mỗi tài liệu có trường type và id dạng {tiền tố}_{khoá} */
const TYPES = {accounts:"acc", devices:"dev", plans:"plan", logs:"log", incidents:"inc", photos:"photo", config:"config", parts:"part", prodlog:"prod"};
let FS, COL;
const R = (c, id) => COL.doc(TYPES[c] + "_" + id);
function Q(c, f, v){ let q = COL.where("type", "==", TYPES[c]); if (f) q = q.where(f, "==", v); return q; }
const docs = (c, sn) => sn.docs.filter(d => d.id.indexOf(TYPES[c] + "_") === 0).map(d => Object.assign({_id: d.id.slice(TYPES[c].length + 1)}, d.data()));
/* Ghi không chờ server (để chạy được khi mất mạng); lỗi sẽ báo sau */
function put(c, id, data, merge){
  const d = Object.assign({type: TYPES[c], updatedAt: Date.now()}, data);
  const p = merge ? R(c, id).set(d, {merge: true}) : R(c, id).set(d);
  p.catch(onErr);
  return p;
}
function onErr(e){
  console.error(e);
  if (e && e.code === "permission-denied") toast(T("Firestore từ chối truy cập. Kiểm tra Security Rules."), "err");
  else if (e && e.code === "unavailable") toast(T("Mất kết nối. Dữ liệu sẽ được gửi khi có mạng."), "err");
  else toast(T("Có lỗi, vui lòng thử lại"), "err");
}
function withTimeout(p, ms){ return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({code: "timeout"}), ms))]); }
const savedMsg = () => toast(navigator.onLine ? T("Đã lưu") : T("Đã lưu. Có mạng sẽ tự gửi lên."), "ok");

/* ================== TRẠNG THÁI ================== */
const S = {user: null, dev: {}, plans: {}, acc: {}, incOpen: {}, incPend: {}, incMonth: [], logsMonth: [], cfg: Object.assign({}, DEF_CFG), loaded: {}};
let V = {view: "home", p: {}};
let UNSUB = [];
let PH = [];            // ảnh đang chọn trong form
let F = {};             // trạng thái tạm của form
let PENDING_DEV = null; // mã thiết bị từ link QR khi chưa đăng nhập
const isMgr = () => S.user && (S.user.role === "admin" || S.user.role === "manager");
const isAdmin = () => S.user && S.user.role === "admin";

function startLive(){
  stopLive();
  const sub = (q, fn) => UNSUB.push(q.onSnapshot(fn, onErr));
  sub(Q("devices"), sn => { S.dev = {}; docs("devices", sn).forEach(d => S.dev[d._id] = d); S.loaded.dev = 1; liveRender(); });
  sub(Q("plans", "active", true), sn => { S.plans = {}; docs("plans", sn).forEach(d => S.plans[d._id] = d); S.loaded.plans = 1; liveRender(); });
  sub(Q("incidents", "open", true), sn => { S.incOpen = {}; docs("incidents", sn).forEach(d => S.incOpen[d._id] = d); liveRender(); });
  sub(Q("incidents", "month", ym()), sn => { S.incMonth = docs("incidents", sn); liveRender(); });
  sub(Q("incidents", "appr", false), sn => { S.incPend = {}; docs("incidents", sn).forEach(d => S.incPend[d._id] = d); liveRender(); });   // báo cáo chờ duyệt
  UNSUB.push(R("config", "main").onSnapshot(s => { S.cfg = Object.assign({}, DEF_CFG, s.exists ? s.data() : {}); liveRender(); }, onErr));
  if (isMgr() || S.user.role === "leader"){
    sub(Q("accounts"), sn => { S.acc = {}; docs("accounts", sn).forEach(d => S.acc[d._id] = d); liveRender(); });
  }
  if (isMgr()) sub(Q("logs", "month", ym()), sn => { S.logsMonth = docs("logs", sn); liveRender(); });
}
function stopLive(){ UNSUB.forEach(u => { try { u(); } catch(e){} }); UNSUB = []; }
let lrT;
function liveRender(){ clearTimeout(lrT); lrT = setTimeout(() => { if (VIEWS[V.view] && VIEWS[V.view].live) render(true); else renderChrome(); }, 60); }

/* ================== KẾ HOẠCH: TÍNH VIỆC ================== */
function planList(){
  return Object.values(S.plans).filter(p => { const d = S.dev[p.devId]; return p.active !== false && (!d || devState(d)[2] === "ok"); });   // máy đang hỏng: tạm dừng lịch
}
const deptOf = id => { const a = S.acc[id]; return a ? (a.dept || a.area || "") : ""; };
function myPlans(){
  const L = planList(), u = S.user;
  if (u.role === "worker") return L.filter(p => !p.assignee || p.assignee === u.id);
  if (u.role === "leader"){ const me = deptOf(u.id); return L.filter(p => !p.assignee || p.assignee === u.id || (me && deptOf(p.assignee) === me)); }   // tổ trưởng: việc của cả bộ phận
  return L;
}
function buckets(){
  const t = today(), sun = endOfWeek(), L = myPlans().sort((a, b) => a.nextDue < b.nextDue ? -1 : 1);
  return {over: L.filter(p => p.nextDue < t), today: L.filter(p => p.nextDue === t), week: L.filter(p => p.nextDue >= t && p.nextDue <= sun)};
}
function dueChip(p){
  const t = today();
  if (p.nextDue < t) return chip(T("Trễ {n} ngày", {n: daysBetween(p.nextDue, t)}), "r");
  if (p.nextDue === t) return chip("Hôm nay", "a");
  return chip(fmtD(p.nextDue), "g");
}
const cycleText = p => p.unit === "once" ? T("1 lần") : T("Mỗi {n} {u}", {n: p.every || 1, u: T(UNITS[p.unit] || "")});
const devName = id => (S.dev[id] && S.dev[id].name) || "";

/* ================== ĐIỀU HƯỚNG ================== */
function go(view, p, replace){
  V = {view, p: p || {}};
  const d0 = (history.state && history.state.d) || 0;
  const st = {view, p: V.p, d: replace ? d0 : d0 + 1};
  try { replace ? history.replaceState(st, "") : history.pushState(st, ""); } catch(e){}
  window.scrollTo(0, 0);
  render();
}
function back(){ ((history.state && history.state.d) || 0) > 0 ? history.back() : go("home", {}, true); }
const NAV_W = [["home","home","Trang chủ"],["knit","knit","Máy đan"],["tasks","list","Việc"],["incidents","alert","Sự cố"],["me","user","Tôi"]];
const NAV_M = [["home","home","Trang chủ"],["knit","knit","Máy đan"],["devices","box","Thiết bị"],["plans","cal","Kế hoạch"],["incidents","alert","Sự cố"],["report","chart","Báo cáo"]];
window.addEventListener("popstate", e => {
  if (SCAN.on){ closeScan(true); return; }
  if ($(".lb")){ $(".lb").remove(); return; }
  const st = e.state;
  if (st && st.view && S.user){
    if (st.view === V.view && JSON.stringify(st.p || {}) === JSON.stringify(V.p)) return;
    V = {view: st.view, p: st.p || {}}; render();
  }
});

/* ================== VẼ GIAO DIỆN ================== */
function render(keepScroll){
  if (!S.user) return;
  const v = VIEWS[V.view] || VIEWS.home;
  if (v.mgr && !isMgr()){ V = {view: "home", p: {}}; return render(); }
  const y = window.scrollY;
  const nav = isMgr() ? NAV_M : NAV_W;
  const isRoot = nav.some(n => n[0] === V.view);
  $("#app").innerHTML =
    '<header class="top">' +
      (isRoot ? '<img class="lg" src="' + LOGO + '" alt="">' : '<button class="hb" onclick="back()" aria-label="back">' + ic("back") + '</button>') +
      '<div class="ttl"><b>' + esc(v.title ? v.title() : T("Bảo trì thiết bị")) + '</b><small>KACHIBOSHI VIỆT NAM</small></div>' +
      '<span class="dot ' + (navigator.onLine ? "" : "off") + '" id="netdot" title="online"></span>' +
      '<button class="hb" onclick="setLang(LANG===\'vi\'?\'ja\':\'vi\')">' + (LANG === "vi" ? "日本語" : "Tiếng Việt") + '</button>' +
      (isMgr() ? '<button class="hb" onclick="go(\'more\')" aria-label="menu">' + ic("user") + '</button>' : "") +
    '</header>' +
    '<main id="main" class="' + (v.wide ? "wide " : "") + "v-" + V.view + '">' + v.html() + '</main>' +
    '<nav class="bn" id="nav"></nav>';
  renderChrome();
  if (v.after) v.after();
  if (keepScroll) window.scrollTo(0, y);
}
function renderChrome(){
  const n = $("#nav"); if (!n) return;
  const nav = isMgr() ? NAV_M : NAV_W;
  const b = buckets();
  const badge = {tasks: b.over.length, incidents: Object.keys(S.incOpen).length};
  if (isMgr()) badge.home = b.over.length;
  n.innerHTML = nav.map(x => '<button class="' + (V.view === x[0] ? "on" : "") + '" onclick="go(\'' + x[0] + '\')">' + ic(x[1]) + esc(T(x[2])) +
    (badge[x[0]] ? '<span class="bd">' + badge[x[0]] + '</span>' : "") + '</button>').join("");
  const d = $("#netdot"); if (d) d.className = "dot " + (navigator.onLine ? "" : "off");
}
window.addEventListener("online", () => { renderChrome(); toast(T("Đã có mạng trở lại, đang gửi dữ liệu…"), "ok"); });
window.addEventListener("offline", () => { renderChrome(); toast(T("Mất kết nối mạng. Vẫn nhập được bình thường, có mạng lại sẽ tự gửi."), "err"); });

const lst = h => '<div class="lst">' + h + '</div>';   // danh sách: 2 cột trên máy tính bảng
const empty = (icon, msg) => '<div class="empty">' + ic(icon) + '<div>' + esc(msg) + '</div></div>';
function planItem(p){
  const t = today(), cls = p.nextDue < t ? "r" : p.nextDue === t ? "a" : "";
  return '<div class="it ' + cls + '" onclick="' + (isWatcher() ? "go('device',{code:'" + p.devId + "'})" : "go('do',{id:'" + p._id + "'})") + '"><div class="f">' +
    '<div class="t1">' + esc(p.task) + '</div>' +
    '<div class="t2"><span class="code">' + esc(p.devId) + '</span> · ' + esc(devName(p.devId)) + '</div></div>' + dueChip(p) + '</div>';
}
function devItem(d, sel){
  const s = devState(d);
  const selBox = sel ? '<span class="sel ' + (F.sel && F.sel[d._id] ? "on" : "") + '">' + ic("ok") + '</span>' : "";
  return '<div class="it ' + (s[1] === "g" ? "" : s[1]) + '" onclick="' + (sel ? "toggleSel('" + d._id + "')" : "go('device',{code:'" + d._id + "'})") + '">' + selBox +
    '<div class="f"><div class="t1"><span class="code">' + esc(d._id) + '</span></div><div class="t2">' + esc([d.name, groupLabel(d), d.area].filter(Boolean).join(" · ")) + '</div></div>' + dChip(d) + '</div>';
}
/* Quy trình sự cố:
   - Người báo (công nhân / tổ trưởng / quản đốc) tự cập nhật từ Đang hỏng đến Đã sửa xong, sửa được báo cáo của mình cho đến khi được duyệt.
   - Quản đốc duyệt cuối cùng, sau khi đã sửa xong. Báo cáo của chính quản đốc tự duyệt khi sửa xong.
   - Quản trị chỉ theo dõi: không báo, không cập nhật, không duyệt. */
const isWatcher = () => S.user && S.user.role === "admin";
const isLocked = i => i.appr === true || (i.appr === undefined && iSt(i) === "done");   // dữ liệu cũ đã xong = coi như đã duyệt
const isPend = i => iSt(i) === "done" && i.appr === false;                              // đã sửa xong, chờ quản đốc duyệt
const canEditInc = i => !isWatcher() && !isLocked(i) && i.by === S.user.id;
const canApprove = i => isPend(i) && S.user.role === "manager" && i.by !== S.user.id;
const autoAppr = () => S.user.role === "manager";
function incItem(i){
  const k = iSt(i), s = ISTATUS[k];
  return '<div class="it ' + (k === "done" ? "" : "r") + '" onclick="go(\'incident\',{id:\'' + i._id + '\'})"><div class="f">' +
    '<div class="t1">' + esc(i.desc || T("Sự cố")) + '</div>' +
    '<div class="t2"><span class="code">' + esc(i.devId) + '</span> · ' + esc(i.devName || devName(i.devId)) + ' · ' + esc(fmtDT(i.at)) + '</div>' +
    (k === "open" && i.next ? '<div class="t2" style="color:var(--a)">➜ ' + esc(i.next) + '</div>' : "") + '</div>' +
    '<div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">' + chip(s[0], s[1]) + (isPend(i) ? chip("Chờ duyệt", "a") : "") +
    '<span class="sm mu">' + esc(k === "open" ? T("{n} ngày", {n: waitDays(i)}) : fmtDur(i.fixAt - i.at)) + '</span></div></div>';
}
/* Thời lượng dễ đọc: phút / giờ / ngày */
function fmtDur(ms){
  const m = Math.max(0, Math.round(ms / 60000));
  if (m < 60) return m + T(" phút");
  if (m < 48 * 60) return (Math.round(m / 6) / 10) + T(" giờ");
  return (Math.round(m / 144) / 10) + T(" ngày");
}

/* ---- Chi tiết thiết bị (mở sau khi quét QR) ---- */
VIEWS.device = {live: true, title: () => T("Thiết bị"), html(){
  const c = V.p.code, d = S.dev[c];
  if (!d) return S.loaded.dev ? empty("box", T("Không tìm thấy thiết bị {c}", {c})) : '<div class="empty"><div class="spin" style="margin:auto"></div></div>';
  const plans = planList().filter(p => p.devId === c).sort((a, b) => a.nextDue < b.nextDue ? -1 : 1);
  const incs = Object.values(S.incOpen).filter(i => i.devId === c);
  let h = '<div class="card"><div class="devhead"><div class="f" style="flex:1;min-width:0"><div class="code" style="font-size:22px">' + esc(c) + '</div>' +
    '<div class="b" style="font-size:18px">' + esc(d.name) + '</div><div style="margin-top:6px">' + dChip(d) + '</div></div>' +
    '<div class="qrm" id="devqr"></div></div>' +
    '<dl class="info" style="margin-top:12px">' +

      (d.gauge ? '<dt>' + esc(T("Loại máy")) + '</dt><dd>' + esc(d.gauge) + '</dd>' : "") +

      ((d.maker || d.model) ? '<dt>' + esc(T("Hãng / Model")) + '</dt><dd>' + esc([d.maker, d.model].filter(Boolean).join(" / ")) + '</dd>' : "") +
      (d.since ? '<dt>' + esc(T("Ngày sử dụng")) + '</dt><dd>' + esc(fmtD(d.since)) + '</dd>' : "") +
      (d.note ? '<dt>' + esc(T("Ghi chú")) + '</dt><dd>' + esc(d.note) + '</dd>' : "") +
    '</dl></div>';
  h += '<div class="btns" style="margin-bottom:6px">' + (isWatcher() ? "" : '<button class="btn r" onclick="go(\'incnew\',{code:\'' + c + '\'})">' + ic("alert") + T("Báo sự cố") + '</button>') +
    (isMgr() ? '<button class="btn w" onclick="go(\'devform\',{code:\'' + c + '\'})">' + ic("edit") + T("Sửa") + '</button>' : "") + '</div>';
  if (incs.length) h += '<h3>' + esc(T("Sự cố chưa xong")) + '</h3>' + incs.map(incItem).join("");
  h += '<h3>' + esc(T("Kế hoạch bảo trì")) + '</h3>' + (plans.length ? plans.map(p => planItem(p)).join("") : empty("cal", T("Chưa có kế hoạch")));
  if (isMgr()) h += '<button class="btn gh" onclick="go(\'planform\',{dev:\'' + c + '\'})">' + ic("plus") + T("Thêm kế hoạch cho máy này") + '</button>';
  h += '<h3>' + esc(T("Linh kiện đã thay")) + '</h3><div id="phist"><div class="empty"><div class="spin" style="margin:auto"></div></div></div>';
  h += '<h3>' + esc(T("Lịch sử gần đây")) + '</h3><div id="hist"><div class="empty"><div class="spin" style="margin:auto"></div></div></div>';

  const c = V.p.code; if (!S.dev[c]) return;
  qrSvg(qrText(c)).then(s => { const e = $("#devqr"); if (e) e.innerHTML = s; }).catch(() => {});
  if (F.histFor === c && F.hist){ drawHist(); return; }
  Promise.all([Q("logs", "devId", c).get(), Q("incidents", "devId", c).get(), Q("parts", "devId", c).get()]).then(([a, b, p]) => {
    F.histFor = c;
    F.hist = docs("logs", a).map(x => Object.assign(x, {_k: "log"})).concat(docs("incidents", b).map(x => Object.assign(x, {_k: "inc"}))).sort((x, y) => y.at - x.at).slice(0, 15);
    F.phist = docs("parts", p).sort((x, y) => y.at - x.at);
    drawHist();
  }).catch(e => { ["#hist", "#phist"].forEach(id => { const el = $(id); if (el) el.innerHTML = empty("clock", T("Không tải được lịch sử")); }); });
}};
function drawHist(){
  // linh kiện đã thay của máy: tổng theo loại + các lần thay gần nhất
  const pe = $("#phist"), P = F.phist || [];
  if (pe){
    const sum = {}; P.forEach(x => sum[x.name] = (sum[x.name] || 0) + (+x.qty || 0));
    pe.innerHTML = P.length ? '<div class="card"><div class="row" style="flex-wrap:wrap;gap:6px;margin-bottom:6px">' +
      Object.entries(sum).sort((a, b) => b[1] - a[1]).map(([n, q]) => '<span class="chip g">' + esc(n) + ' × ' + q + '</span>').join("") + '</div>' +
      P.slice(0, 10).map(x => '<div class="nl"><div class="row"><span class="f"><b>' + esc(x.name) + '</b> × ' + esc(x.qty) + '</span><span class="sm mu">' + esc(fmtDT(x.at)) + '</span></div>' +
        '<div class="sm mu">' + esc((x.src === "inc" ? T("Sửa máy hỏng") : T("Bảo trì định kỳ")) + " · " + (x.byName || "")) + '</div></div>').join("") +
      (P.length > 10 ? '<div class="sm mu" style="padding:8px 0">' + esc(T("và {n} lần thay khác", {n: P.length - 10})) + '</div>' : "") + '</div>'
      : empty("box", T("Chưa thay linh kiện nào"));
  }
  const el = $("#hist"); if (!el) return;
  el.innerHTML = F.hist.length ? F.hist.map(x => x._k === "inc" ? incItem(x) :
    '<div class="it ' + (x.result === "ng" ? "r" : "") + '" style="cursor:default"><div class="f"><div class="t1">' + esc(x.task) + '</div><div class="t2">' + esc(fmtDT(x.at)) + ' · ' + esc(x.byName) + (x.note ? " · " + esc(x.note) : "") + '</div></div>' +
    (x.result === "ng" ? chip("Không đạt", "r") : chip("Đạt", "g")) + (x.late ? chip("Trễ", "r") : "") + '</div>').join("") : empty("clock", T("Chưa có lịch sử"));
}

VIEWS.do = {title: () => T("Ghi kết quả bảo trì"), html(){
  if (isWatcher()) return empty("cal", T("Quản trị chỉ theo dõi, không ghi kết quả bảo trì."));
  const p = S.plans[V.p.id];
  if (!p) return empty("cal", T("Kế hoạch không còn hoặc đã hoàn thành"));
  if (F.planId !== p._id){ F = {planId: p._id, ck: {}, res: "", note: "", parts: []}; PH = []; }
  const steps = p.steps || [];
  let h = '<div class="card"><div class="t2 mu"><span class="code">' + esc(p.devId) + '</span> · ' + esc(devName(p.devId)) + '</div>' +
    '<div class="b" style="font-size:20px;margin:2px 0 6px">' + esc(p.task) + '</div>' +
    '<div class="row" style="flex-wrap:wrap;gap:6px">' + dueChip(p) + chip(cycleText(p), "m") + '</div>' +
    (p.note ? '<div class="hl" style="margin:10px 0 0">' + esc(p.note) + '</div>' : "") + '</div>';
  if (steps.length){
    h += '<h3>' + esc(T("Các bước kiểm tra")) + ' (<span id="ckn">' + Object.values(F.ck).filter(Boolean).length + '</span>/' + steps.length + ')</h3>';
    h += steps.map((s, i) => '<div class="ck ' + (F.ck[i] ? "on" : "") + '" onclick="tick(this,' + i + ')"><span class="bx">' + ic("ok") + '</span><span>' + esc(s) + '</span></div>').join("");
  }
  h += '<h3 class="req">' + esc(T("Kết quả")) + '</h3><div class="opts">' +
    '<button class="opt res ' + (F.res === "ok" ? "on" : "") + '" onclick="setRes(\'ok\')">✔ ' + esc(T("Đạt")) + '</button>' +
    '<button class="opt res r ' + (F.res === "ng" ? "on" : "") + '" onclick="setRes(\'ng\')">✖ ' + esc(T("Không đạt")) + '</button></div>';
  h += '<div class="lc" style="margin-top:14px"><label>' + esc(T("Ghi chú")) + ' <span class="mu sm">(' + esc(T("không bắt buộc")) + ')</span></label><textarea id="note" oninput="F.note=this.value">' + esc(F.note) + '</textarea></div>';
  h += partsSection();
  h += '<div class="lc"><label>' + esc(T("Ảnh")) + ' <span class="mu sm">(' + esc(T("không bắt buộc")) + ')</span></label>' + photoBox(3) + '</div>';
  h += '<button class="btn" style="margin-top:8px" onclick="saveDo()">' + ic("ok") + T("LƯU KẾT QUẢ") + '</button>';
  return h;
}};
function tick(el, i){ F.ck[i] = !F.ck[i]; el.classList.toggle("on", F.ck[i]); const n = $("#ckn"); if (n) n.textContent = Object.values(F.ck).filter(Boolean).length; vib(); }
function setRes(r){ F.res = r; document.querySelectorAll(".opt.res").forEach(b => b.classList.remove("on")); document.querySelectorAll(".opt.res")[r === "ok" ? 0 : 1].classList.add("on"); }
async function saveDo(){
  const p = S.plans[V.p.id]; if (!p) return;
  if (!F.res){ toast(T("Chọn kết quả Đạt hoặc Không đạt"), "err"); return; }
  const steps = p.steps || [];
  const prow = partsRows(); if (!prow) return;
  if (F.res === "ok" && steps.length && steps.some((s, i) => !F.ck[i]) && !confirm(T("Chưa tick hết các bước. Vẫn lưu?"))) return;
  busy(true);
  try {
    const t = today(), pids = savePhotos(p.devId);
    const late = p.nextDue < t;
    const logId = uid();
    saveParts(prow, p.devId, "log", logId);
    put("logs", logId, {planId: p._id, devId: p.devId, devName: devName(p.devId), task: p.task,
      steps: steps.map((s, i) => ({t: s, ok: !!F.ck[i]})), result: F.res, note: (F.note || "").trim(), photos: pids, parts: prow,
      due: p.nextDue, late, by: S.user.id, byName: S.user.name, at: Date.now(), date: t, month: ym(t)});
    let next = p.nextDue, upd = {lastDone: t, lastBy: S.user.name};
    if (p.unit === "once"){ upd.active = false; upd.doneAt = Date.now(); }
    else { do { next = addCycle(next, p.every, p.unit); } while (next <= t); upd.nextDue = next; }
    put("plans", p._id, upd, true);
    const res = F.res, note = F.note, dev = p.devId, task = p.task;
    F = {}; PH = [];
    savedMsg(); vib();
    if (res === "ng" && confirm(T("Kết quả Không đạt. Báo sự cố cho máy này luôn?"))){ F = {pre: task + (note ? ": " + note : "")}; go("incnew", {code: dev}, true); }
    else go("device", {code: dev}, true);
  } finally { busy(false); }
}

/* ---- Linh kiện đã thay: ô nhập dùng chung ---- */
function partsBox(){
  const L = F.parts || (F.parts = []);
  return '<div id="partsbox">' + L.map((r, i) => '<div class="prow"><input class="pn" list="dl_parts" placeholder="' + esc(T("Tên linh kiện")) + '" value="' + esc(r.n) + '" oninput="F.parts[' + i + '].n=this.value">' +
    '<input class="pq" type="number" min="1" step="1" inputmode="numeric" value="' + esc(r.q) + '" oninput="F.parts[' + i + '].q=this.value" aria-label="SL">' +
    '<button class="btn w px" onclick="F.parts.splice(' + i + ',1);refreshParts()" aria-label="x">' + ic("x") + '</button></div>').join("") +
    '<button class="btn sm gh" onclick="F.parts.push({n:\'\',q:1});refreshParts()">' + ic("plus") + T("Thêm linh kiện") + '</button>' +
    '<datalist id="dl_parts">' + (S.cfg.parts || []).map(p => '<option value="' + esc(p) + '">').join("") + '</datalist></div>';
}
function refreshParts(){ const e = $("#partsbox"); if (e) e.outerHTML = partsBox(); const ins = document.querySelectorAll("#partsbox .pn"); if (ins.length) ins[ins.length - 1].focus(); }
const partsSection = () => '<div class="lc"><label>' + esc(T("Linh kiện đã thay")) + ' <span class="mu sm">(' + esc(T("nếu có")) + ')</span></label>' + partsBox() + '</div>';
/* Kiểm tra trước khi lưu: trả về danh sách hợp lệ, hoặc null nếu có dòng sai */
function partsRows(){
  const out = [];
  for (const r of (F.parts || [])){
    const n = String(r.n || "").trim(), q = Number(r.q);
    if (!n) continue;
    if (!Number.isInteger(q) || q < 1){ toast(T("Số lượng linh kiện \"{n}\" không hợp lệ", {n}), "err"); return null; }
    out.push({n, q});
  }
  return out;
}
function saveParts(rows, devId, src, srcId){
  if (!rows || !rows.length) return;
  const d = S.dev[devId] || {}, now = Date.now(), t = today();
  rows.forEach(r => put("parts", uid(), {devId, devName: d.name || "", group: d.group || "", gauge: d.gauge || "", area: d.area || "", name: r.n, qty: r.q,
    src, srcId: srcId || "", by: S.user.id, byName: S.user.name, at: now, date: t, month: ym(t)}));
  const newNames = rows.map(r => r.n).filter(n => (S.cfg.parts || []).indexOf(n) < 0);   // tên mới tự thêm vào danh mục
  if (newNames.length) put("config", "main", {parts: Array.from(new Set((S.cfg.parts || []).concat(newNames)))}, true);
  F.histFor = "";   // tải lại lịch sử máy
}

/* ---- Ảnh: chụp, nén, đóng dấu ---- */
function photoBox(max){
  return '<div class="phs" id="phs">' + PH.map((d, i) => '<div class="ph"><img src="' + d + '" onclick="zoom(this.src)"><button class="x" onclick="PH.splice(' + i + ',1);refreshPh(' + max + ')">' + ic("x") + '</button></div>').join("") +
    (PH.length < max ? '<label class="phadd">' + ic("cam") + esc(T("Chụp ảnh")) + '<input type="file" accept="image/*" capture="environment" style="display:none" onchange="addPh(this,' + max + ')"></label>' : "") + '</div>';
}
function refreshPh(max){ const e = $("#phs"); if (e) e.outerHTML = photoBox(max); }
async function addPh(inp, max){
  const f = inp.files && inp.files[0]; if (!f) return;
  busy(true);
  try { PH.push(await compress(f)); refreshPh(max); }
  catch(e){ toast(T("Không đọc được ảnh"), "err"); }
  finally { busy(false); }
}
function compress(file){
  return new Promise((ok, err) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const M = 1024, s = Math.min(1, M / Math.max(img.width, img.height));
      const w = Math.round(img.width * s), h = Math.round(img.height * s);
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const g = c.getContext("2d"); g.drawImage(img, 0, 0, w, h);
      // đóng dấu ngày giờ + máy + người chụp
      const code = V.p.code || (S.plans[V.p.id] && S.plans[V.p.id].devId) || "";
      const txt = fmtDT(Date.now()) + "  " + code + "  " + S.user.name;
      const fs = Math.max(14, Math.round(w / 40));
      g.font = "bold " + fs + "px sans-serif"; g.fillStyle = "rgba(0,0,0,.55)"; g.fillRect(0, h - fs * 1.7, w, fs * 1.7);
      g.fillStyle = "#fff"; g.fillText(txt, fs * .6, h - fs * .55);
      let q = .6, d = c.toDataURL("image/jpeg", q);
      while (d.length > 200000 && q > .3){ q -= .1; d = c.toDataURL("image/jpeg", q); }
      URL.revokeObjectURL(url); ok(d);
    };
    img.onerror = () => { URL.revokeObjectURL(url); err(); };
    img.src = url;
  });
}
function savePhotos(dev){ return PH.map(d => { const id = uid(); put("photos", id, {data: d, devId: dev, at: Date.now()}); return id; }); }
function zoom(src){
  const d = document.createElement("div"); d.className = "lb"; d.innerHTML = '<img src="' + src + '">';
  d.onclick = e => { if (e.target.tagName === "IMG") d.classList.toggle("z"); else { d.remove(); history.back(); } };
  document.body.appendChild(d); history.pushState({lb: 1, d: ((history.state && history.state.d) || 0) + 1}, "");
}
function loadPhotos(ids, el){
  if (!el || !ids || !ids.length) return;
  el.innerHTML = ids.map(id => '<div class="ph" id="p_' + id + '"><div class="phload">…</div></div>').join("");
  ids.forEach(id => R("photos", id).get().then(s => { const b = document.getElementById("p_" + id); if (b && s.exists) b.innerHTML = '<img src="' + s.data().data + '" onclick="zoom(this.src)">'; }).catch(() => {}));
}

const curInc0 = id => (F.incCache && F.incCache._id === id && Date.now() - (F.incCache._fresh || 0) < 5000 ? F.incCache : null) || S.incPend[id] || S.incOpen[id] || S.incMonth.find(x => x._id === id) || (F.incCache && F.incCache._id === id ? F.incCache : null);
function devSelect(id, val, onch){

const curInc = () => (F.incCache && F.incCache._id === V.p.id && Date.now() - (F.incCache._fresh || 0) < 5000) ? F.incCache : (S.incPend[V.p.id] || S.incOpen[V.p.id] || S.incMonth.find(x => x._id === V.p.id) || F.incCache);

    const log = nextLog(i).concat([{t, by: S.user.name, at: now}]);

    put("incidents", i._id, u, true); F.incCache = Object.assign({}, i, u); F.next = "";

/* Mã tự động: KCB-0001, KCB-0002… (không gắn với xưởng để máy chuyển xưởng không phải in lại tem) */
function nextCode(from){
  let max = from || 0;
  Object.keys(S.dev).forEach(k => { const m = k.match(/^KCB-(\d+)$/); if (m) max = Math.max(max, +m[1]); });
  return "KCB-" + String(max + 1).padStart(4, "0");
}
async function saveDev(){
  const editing = V.p.code;
  let code = editing || ($("#fcode").value || "").trim().toUpperCase();
  const name = $("#fname").value.trim();
  if (!/^[A-Z0-9][A-Z0-9._-]{1,29}$/.test(code)){ toast(T("Mã không hợp lệ (2–30 ký tự: chữ, số, - _ .)"), "err"); return; }
  const group = $("#fgroup").value, gauge = isKnit(group) ? $("#fgauge").value : "";
  if (!group){ toast(T("Chọn nhóm máy"), "err"); return; }
  if (isKnit(group) && !gauge){ toast(T("Chọn loại máy (7G–15G)"), "err"); return; }
  if (!name){ toast(T("Nhập tên thiết bị"), "err"); return; }
  const d = {group, gauge, name, area: $("#farea").value.trim(), maker: $("#fmaker").value.trim(), model: $("#fmodel").value.trim(),
    since: $("#fsince").value, status: F.status || "ok", note: $("#fnote").value.trim()};
  if (editing){ put("devices", code, d, true); savedMsg(); back(); return; }
  const auto = code === F.auto;
  if (S.dev[code] && !auto){ toast(T("Mã {c} đã tồn tại", {c: code}), "err"); return; }
  busy(true);
  try {
    // mã tự đặt: nếu người khác vừa lấy mất số này thì tự nhảy sang số tiếp theo
    let c = auto && S.dev[code] ? nextCode() : code;
    for (let n = 0; ; n++){
      try {
        await withTimeout(FS.runTransaction(async tx => {
          const ref = R("devices", c), s = await tx.get(ref);
          if (s.exists) throw {code: "dup"};
          tx.set(ref, Object.assign({type: "dev", code: c, createdAt: Date.now(), createdBy: S.user.id, updatedAt: Date.now()}, d));
        }), 15000);
        break;
      } catch(e){
        if (!(e && e.code === "dup" && auto && n < 5)) throw e;
        c = nextCode(+c.slice(4));
      }
    }
    code = c;
    toast(T("Đã thêm thiết bị {c}", {c: code}), "ok");
    go("device", {code}, true);
  } catch(e){
    if (e && e.code === "dup") toast(T("Mã {c} đã tồn tại", {c: code}), "err");
    else if (e && (e.code === "timeout" || e.code === "unavailable")) toast(T("Cần có mạng để tạo thiết bị mới (kiểm tra trùng mã)"), "err");
    else onErr(e);
  } finally { busy(false); }
}

function qrText(code){
  const base = location.protocol.indexOf("http") === 0 ? location.origin + location.pathname : "";

}
async function qrSvg(text){
  await loadScript(LIB.qrGen);
  const q = qrcode(0, "M"); q.addData(unescape(encodeURIComponent(text))); q.make();
  return q.createSvgTag({cellSize: 4, margin: 0, scalable: true});
}

    const [lg, ...incs] = await Promise.all([(!F.repCache["l" + m] || m === ym()) ? Q("logs", "month", m).get() : null].concat(need.map(x => Q("incidents", "month", x).get())));

  if (F.repM !== m || V.view !== "report") return;

function drawReport(m, ms){
  const el = $("#rep"); if (!el) return;
  const logs = F.repCache["l" + m] || [], inc = F.repCache["i" + m] || [], now = Date.now();
  const fixed = inc.filter(i => iSt(i) === "done" && i.fixAt);
  const avgFix = fixed.length ? fixed.reduce((a, i) => a + (i.fixAt - i.at), 0) / fixed.length : null;
  const down = inc.reduce((a, i) => a + ((i.fixAt || now) - i.at), 0);

  logs.forEach(l => { const k = areaOf(l.devId); const o = ar[k] = ar[k] || {dev: 0, inc: 0, lg: 0, ok: 0}; o.lg++; if (!l.late) o.ok++; });
  h += '<div class="card"><div class="b" style="margin-bottom:6px">' + esc(T("Theo khu vực")) + '</div><div class="scroll"><table class="t"><thead><tr><th>' + esc(T("Khu vực")) + '</th><th class="n">' + esc(T("Số máy")) + '</th><th class="n">' + esc(T("Lần hỏng")) + '</th><th class="n">' + esc(T("Đúng hạn")) + '</th></tr></thead><tbody>' +

  parts.forEach(x => { const o = pt[x.name] = pt[x.name] || {q: 0, n: 0, dev: new Set(), by: {}}; const g = groupLabel(x) || T("(Chưa phân nhóm)");

  el.innerHTML = h;
}

async function saveAcc(){
  const e = V.p.id ? S.acc[V.p.id] : null;
  const id = e ? V.p.id : ($("#aid").value || "").trim().toUpperCase();
  const name = $("#aname").value.trim(), pin = $("#apin").value.trim();
  if (!/^[A-Z0-9._-]{2,20}$/.test(id)){ toast(T("Mã NV không hợp lệ (chữ, số, 2–20 ký tự)"), "err"); return; }
  if (!name){ toast(T("Nhập họ tên"), "err"); return; }
  if ((!e || pin) && !/^\d{4,8}$/.test(pin)){ toast(T("PIN phải gồm 4–8 chữ số"), "err"); return; }
  if (!isAdmin() && F.role !== "worker" && F.role !== "leader"){ toast(T("Không có quyền"), "err"); return; }
  const dept = $("#adept").value;
  if (!dept){ toast(T("Chọn bộ phận"), "err"); return; }
  if (!e && S.acc[id]){ toast(T("Mã NV {c} đã tồn tại", {c: id}), "err"); return; }
  const d = {name, role: F.role, dept, active: e ? F.active : true};
  if (pin){ d.salt = uid(); d.hash = await sha256(d.salt + ":" + pin); }
  if (!e){ d.createdAt = Date.now(); d.createdBy = S.user.id; }
  put("accounts", id, d, !!e);
  savedMsg(); back();
}

/* ---- Xoá dữ liệu theo khoảng thời gian (chỉ Quản trị, mật khẩu 112) ---- */
const PURGE_PW = "112";
const PURGE_KINDS = [["logs", "Nhật ký bảo trì"], ["incidents", "Sự cố đã xong (kèm ảnh)"], ["parts", "Linh kiện đã thay"]];
function monthsBetween(a, b){ const out = []; let [y, m] = a.split("-").map(Number); const [y2, m2] = b.split("-").map(Number); while (y < y2 || (y === y2 && m <= m2)){ out.push(y + "-" + pad(m)); if (++m > 12){ m = 1; y++; } } return out; }
VIEWS.purge = {mgr: true, title: () => T("Xoá dữ liệu theo thời gian"), html(){
  if (!isAdmin()) return empty("trash", T("Không có quyền"));
  if (!F.pg){ const d = new Date(); d.setMonth(d.getMonth() - 12); F = {pg: 1, from: ymd(new Date(d.getFullYear(), d.getMonth(), 1)), to: ymd(new Date(d.getFullYear(), d.getMonth() + 1, 0)), kinds: {logs: true, incidents: true, parts: true}, plan: null}; }
  let h = '<div class="hl" style="background:var(--rl);color:var(--r)">' + esc(T("Dữ liệu bị xoá không khôi phục được. Nên xuất Excel trước khi xoá.")) + '</div>';
  h += '<div class="grid2"><div class="lc"><label class="req">' + esc(T("Từ ngày")) + '</label><input id="pgf" type="date" value="' + F.from + '" onchange="F.from=this.value;F.plan=null;pgShow()"></div>' +
    '<div class="lc"><label class="req">' + esc(T("Đến ngày")) + '</label><input id="pgt" type="date" value="' + F.to + '" onchange="F.to=this.value;F.plan=null;pgShow()"></div></div>';
  h += '<div class="lc"><label>' + esc(T("Loại dữ liệu cần xoá")) + '</label>' + PURGE_KINDS.map(([k, l]) => '<div class="ck ' + (F.kinds[k] ? "on" : "") + '" onclick="F.kinds.' + k + '=!F.kinds.' + k + ';this.classList.toggle(\'on\',F.kinds.' + k + ');F.plan=null;pgShow()"><span class="bx">' + ic("ok") + '</span><span>' + esc(T(l)) + '</span></div>').join("") +
    '<div class="mu sm">' + esc(T("Không xoá: danh sách máy, kế hoạch, tài khoản, danh mục. Sự cố chưa sửa xong hoặc đang chờ duyệt được giữ lại.")) + '</div></div>';
  h += '<button class="btn w" onclick="pgCheck()">' + ic("search") + T("Kiểm tra số lượng sẽ xoá") + '</button><div id="pgres" style="margin-top:12px"></div>';
  return h;
}, after(){ pgShow(); }};
function pgShow(){
  const el = $("#pgres"); if (!el) return;
  if (!F.plan){ el.innerHTML = ""; return; }
  const P = F.plan, tot = P.logs.length + P.incidents.length + P.parts.length + P.photos.length;
  el.innerHTML = '<div class="card"><div class="b" style="margin-bottom:6px">' + esc(T("Từ {a} đến {b} sẽ xoá:", {a: fmtD(F.from), b: fmtD(F.to)})) + '</div>' +
    '<dl class="info"><dt>' + esc(T("Nhật ký bảo trì")) + '</dt><dd>' + P.logs.length + '</dd><dt>' + esc(T("Sự cố")) + '</dt><dd>' + P.incidents.length + '</dd><dt>' + esc(T("Ảnh")) + '</dt><dd>' + P.photos.length + '</dd><dt>' + esc(T("Linh kiện đã thay")) + '</dt><dd>' + P.parts.length + '</dd></dl></div>' +
    (tot ? '<div class="lc"><label class="req">' + esc(T("Mật khẩu xoá")) + '</label><input id="pgpw" class="pin" type="password" inputmode="numeric" autocomplete="off"></div>' +
      '<button class="btn r" onclick="pgRun()">' + ic("trash") + T("XOÁ {n} BẢN GHI", {n: tot}) + '</button>' : empty("ok", T("Không có dữ liệu nào trong khoảng này.")));
}
async function pgCheck(){
  if (!isAdmin()) return;
  if (!F.from || !F.to || F.from > F.to){ toast(T("Khoảng ngày không hợp lệ"), "err"); return; }
  if (!PURGE_KINDS.some(([k]) => F.kinds[k])){ toast(T("Chọn ít nhất một loại dữ liệu"), "err"); return; }
  busy(true);
  try {
    const months = monthsBetween(F.from.slice(0, 7), F.to.slice(0, 7)), inRange = x => x.date >= F.from && x.date <= F.to, P = {logs: [], incidents: [], parts: [], photos: []};
    for (const m of months){
      if (F.kinds.logs) P.logs.push(...docs("logs", await Q("logs", "month", m).get()).filter(inRange));
      if (F.kinds.incidents) P.incidents.push(...docs("incidents", await Q("incidents", "month", m).get()).filter(i => inRange(i) && iSt(i) === "done" && isLocked(i)));
      if (F.kinds.parts) P.parts.push(...docs("parts", await Q("parts", "month", m).get()).filter(inRange));
    }
    P.photos = Array.from(new Set(P.logs.concat(P.incidents).flatMap(x => x.photos || [])));
    F.plan = P; pgShow();
  } catch(e){ onErr(e); } finally { busy(false); }
}
async function pgRun(){
  if (!isAdmin() || !F.plan) return;
  const pw = ($("#pgpw") || {}).value || "";
  if (pw !== PURGE_PW){ toast(T("Sai mật khẩu xoá"), "err"); return; }
  const P = F.plan, refs = P.logs.map(x => R("logs", x._id)).concat(P.incidents.map(x => R("incidents", x._id)), P.parts.map(x => R("parts", x._id)), P.photos.map(id => R("photos", id)));
  if (!confirm(T("Xoá vĩnh viễn {n} bản ghi từ {a} đến {b}?", {n: refs.length, a: fmtD(F.from), b: fmtD(F.to)}))) return;
  busy(true);
  try {
    for (let i = 0; i < refs.length; i += 400){ const b = FS.batch(); refs.slice(i, i + 400).forEach(r => b.delete(r)); await withTimeout(b.commit(), 60000); }
    F.repCache = {}; F.plan = null; F.histFor = "";
    toast(T("Đã xoá {n} bản ghi", {n: refs.length}), "ok"); pgShow();
  } catch(e){
    if (e && e.code === "permission-denied") toast(T("Security Rules đang chặn việc xoá. Cần cho phép xoá trong Firestore Rules."), "err"); else onErr(e);
  } finally { busy(false); }
}

/* ================== QUÉT QR ================== */
const SCAN = {on: false, stream: null, det: null, mode: ""};
async function openScan(mode){
  SCAN.on = true; SCAN.mode = mode || "";
  const ov = document.createElement("div"); ov.className = "scan"; ov.id = "scan";
  ov.innerHTML = '<video playsinline muted autoplay></video><div class="frame"></div>' +
    '<div class="bar"><button class="hb" onclick="closeScan()" style="background:rgba(0,0,0,.5)">' + ic("x") + '</button><div class="f b" style="flex:1;font-size:18px">' + esc(T("Đưa mã QR trên máy vào khung")) + '</div></div>' +
    '<div class="msg" id="smsg">' + esc(T("Đang mở camera…")) + '</div>' +
    '<div class="man"><div class="row"><input class="f code" id="mcode" placeholder="' + esc(T("Hoặc nhập mã máy")) + '" autocapitalize="characters" style="text-transform:uppercase"><button class="btn sm" onclick="scanHit(document.getElementById(\'mcode\').value)">OK</button></div></div>';
  document.body.appendChild(ov);
  history.pushState({scan: 1, d: ((history.state && history.state.d) || 0) + 1}, "");
  const msg = t => { const m = $("#smsg"); if (m) m.textContent = t; };
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("nocam");
    SCAN.stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: "environment", width: {ideal: 1280}}, audio: false});
    if (!SCAN.on){ stopCam(); return; }
    const v = ov.querySelector("video"); v.srcObject = SCAN.stream; await v.play();
    if ("BarcodeDetector" in window){ try { const f = await BarcodeDetector.getSupportedFormats(); if (f.indexOf("qr_code") >= 0) SCAN.det = new BarcodeDetector({formats: ["qr_code"]}); } catch(e){} }
    if (!SCAN.det) await loadScript(LIB.jsQR);
    msg("");
    const cv = document.createElement("canvas"), g = cv.getContext("2d", {willReadFrequently: true});
    const loop = async () => {
      if (!SCAN.on) return;
      try {
        if (v.readyState >= 2){
          let txt = null;
          if (SCAN.det){ const r = await SCAN.det.detect(v); if (r && r[0]) txt = r[0].rawValue; }
          else { const s = Math.min(1, 640 / v.videoWidth); cv.width = v.videoWidth * s; cv.height = v.videoHeight * s; g.drawImage(v, 0, 0, cv.width, cv.height);
            const r = jsQR(g.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height, {inversionAttempts: "dontInvert"}); if (r) txt = r.data; }
          if (txt && scanHit(txt)) return;
          if (txt){ setTimeout(loop, 1800); return; }
        }
      } catch(e){}
      setTimeout(loop, 160);
    };
    loop();
  } catch(e){
    msg(T("Không mở được camera. Cho phép quyền camera hoặc nhập mã bên dưới."));
  }
}
function stopCam(){ if (SCAN.stream){ SCAN.stream.getTracks().forEach(t => t.stop()); SCAN.stream = null; } }
function closeScan(fromPop){ SCAN.on = false; stopCam(); const o = $("#scan"); if (o) o.remove(); if (!fromPop) history.back(); }
function parseCode(txt){
  txt = String(txt || "").trim();
  let m = txt.match(/[#?&]dev=([^&#]+)/); if (m) return decodeURIComponent(m[1]).toUpperCase();
  m = txt.match(/^KCB:(.+)$/i); if (m) return m[1].trim().toUpperCase();
  return txt.toUpperCase();
}
function scanHit(txt){
  const c = parseCode(txt); if (!c) return false;
  vib();
  if (!S.dev[c]){
    const m = $("#smsg"); if (m) m.textContent = T("Không tìm thấy thiết bị {c}", {c});
    toast(T("Không tìm thấy thiết bị {c}", {c}), "err");
    return false;
  }
  const mode = SCAN.mode, d = (history.state && history.state.d) || 1;
  SCAN.on = false; stopCam(); const o = $("#scan"); if (o) o.remove();
  if (mode === "inc"){ F.code = c; V.p = Object.assign({}, V.p, {code: c}); history.back(); setTimeout(() => render(), 80); }   // quay lại form báo sự cố
  else { V = {view: "device", p: {code: c}}; history.replaceState({view: "device", p: V.p, d}, ""); window.scrollTo(0, 0); render(); }
  return true;
}

function loginScreen(first, err){

    '<div class="lc"><label>' + esc(T("Mã PIN")) + '</label><input id="lpin" class="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')doLogin(' + (first ? 1 : 0) + ')"></div>' +
    '<button class="btn" onclick="doLogin(' + (first ? 1 : 0) + ')">' + (first ? T("TẠO VÀ ĐĂNG NHẬP") : T("ĐĂNG NHẬP")) + '</button>' +
    '<div class="btns" style="margin-top:14px;justify-content:center"><button class="btn sm w" onclick="LANG=LANG===\'vi\'?\'ja\':\'vi\';lsSet(\'kb_lang\',LANG);loginScreen(' + (first ? 1 : 0) + ')">' + ic("globe") + (LANG === "vi" ? "日本語" : "Tiếng Việt") + '</button></div>' +
    foot() + '</div>';
  setTimeout(() => { const f = (first || !last) ? $("#lid") : $("#lpin"); if (f) f.focus(); }, 50);
}
async function doLogin(first){
  const id = ($("#lid").value || "").trim().toUpperCase(), pin = ($("#lpin").value || "").trim();
  if (!id || !/^\d{4,8}$/.test(pin)){ toast(T("Nhập mã nhân viên và PIN 4–8 số"), "err"); return; }
  busy(true);
  try {
    if (first){
      const name = ($("#lname").value || "").trim() || "Admin";
      if (!/^[A-Z0-9._-]{2,20}$/.test(id)){ toast(T("Mã NV không hợp lệ (chữ, số, 2–20 ký tự)"), "err"); return; }
      const salt = uid(), hash = await sha256(salt + ":" + pin);
      await withTimeout(R("accounts", id).set({type: "acc", name, role: "admin", active: true, salt, hash, createdAt: Date.now(), updatedAt: Date.now()}), 15000);
      return enter({id, name, role: "admin", hash});
    }
    const s = await R("accounts", id).get();
    if (!s.exists){ toast(T("Sai mã nhân viên hoặc PIN"), "err"); return; }
    const a = s.data();
    if (a.active === false){ toast(T("Tài khoản đã bị khoá"), "err"); return; }
    if (await sha256(a.salt + ":" + pin) !== a.hash){ toast(T("Sai mã nhân viên hoặc PIN"), "err"); return; }
    enter({id, name: a.name, role: a.role, hash: a.hash});
  } catch(e){ const c = (e && e.code) || "unknown"; const el = $("#connerr"); if (el && c !== "dup") el.innerHTML = connErr(c); else onErr(e); } finally { busy(false); }
}
function enter(u){
  S.user = {id: u.id, name: u.name, role: u.role};
  lsSet("kb_sess", JSON.stringify(u)); lsSet("kb_last", u.id);
  startLive();
  const c = PENDING_DEV; PENDING_DEV = null;
  go(c ? "device" : "home", c ? {code: c} : {}, true);
}

}

async function boot(){
  document.documentElement.lang = LANG;
  const m = location.hash.match(/dev=([^&]+)/);
  if (m){ PENDING_DEV = decodeURIComponent(m[1]).toUpperCase(); history.replaceState(null, "", location.pathname + location.search); }
  try {
    await loadScript(LIB.fbApp); await loadScript(LIB.fbStore);
    firebase.initializeApp(firebaseConfig);
    FS = firebase.firestore();
    try { await FS.enablePersistence({synchronizeTabs: true}); } catch(e){}
    COL = FS.collection(COLLECTION);
  } catch(e){
    $("#app").innerHTML = '<div class="boot"><img src="' + LOGO + '"><div>' + esc(T("Không tải được ứng dụng. Kiểm tra mạng rồi thử lại.")) + '</div><button class="btn" style="max-width:260px" onclick="location.reload()">' + T("Thử lại") + '</button></div>';
    return;
  }
  // phiên đăng nhập cũ
  let sess = null; try { sess = JSON.parse(lsGet("kb_sess") || "null"); } catch(e){}
  if (sess && sess.id){
    S.user = {id: sess.id, name: sess.name, role: sess.role};
    startLive(); go(PENDING_DEV ? "device" : "home", PENDING_DEV ? {code: PENDING_DEV} : {}, true); PENDING_DEV = null;
    // kiểm tra lại tài khoản (bị khoá / đổi PIN / đổi vai trò)
    R("accounts", sess.id).get().then(s => {
      const a = s.exists ? s.data() : null;
      if (!a || a.active === false || a.hash !== sess.hash){ lsSet("kb_sess", null); S.user = null; stopLive(); loginScreen(false); toast(T("Phiên đăng nhập hết hiệu lực, đăng nhập lại"), "err"); }
      else if (a.role !== sess.role || a.name !== sess.name){ sess.role = a.role; sess.name = a.name; lsSet("kb_sess", JSON.stringify(sess)); S.user.role = a.role; S.user.name = a.name; startLive(); render(); }
    }).catch(() => {});
    return;
  }
  try {
    const sn = await withTimeout(Q("accounts").limit(1).get(), 15000);
    loginScreen(sn.empty);
  } catch(e){ console.error(e); loginScreen(false, (e && e.code) || "unknown"); }
}
