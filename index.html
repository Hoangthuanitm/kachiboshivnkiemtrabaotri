<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E7A3C">
<title>Kachiboshi – Quản lý bảo trì</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
/* ===== Màu & token theo logo Kachiboshi ===== */
:root{
  --g:#1E7A3C; --g-d:#14592A; --g-l:#E7F3EB; --y:#F5D90A; --y-l:#FFF9D6;
  --bg:#F7F9F7; --card:#FFFFFF; --tx:#1F2937; --mut:#6B7280; --bd:#E3E8E4;
  --red:#C62828; --red-l:#FDECEC; --amb:#B45309; --amb-l:#FEF3C7; --gr-l:#F1F3F2; --blu:#1D5C9A; --blu-l:#E6F0FA;
  --r:12px; --sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08); --side:240px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.5}
html[lang=ja] body{font-family:"Noto Sans JP","Be Vietnam Pro",system-ui,sans-serif}
a{color:var(--g)}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ===== Khung ===== */
.app{display:flex;min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:#fff;border-right:1px solid var(--bd);display:flex;flex-direction:column;z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;border-bottom:1px solid var(--bd)}
.brand img{width:46px;height:46px;object-fit:contain}
.brand b{display:block;color:var(--g);font-size:15px;letter-spacing:.3px;line-height:1.2}
.brand small{color:var(--mut);font-size:12px}
.nav{padding:10px;display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--tx);text-decoration:none;font-weight:500;min-height:44px}
.nav a:hover{background:var(--gr-l)}
.nav a.on{background:var(--g-l);color:var(--g)}
.nav a .cnt{margin-left:auto;background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:600}
.nav .sep{height:1px;background:var(--bd);margin:8px 6px}
.side .foot{padding:12px 14px;border-top:1px solid var(--bd);display:flex;align-items:center;gap:10px}
.side .foot .u{flex:1;min-width:0;font-size:13px}
.side .foot .u b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .foot .u small{color:var(--mut)}
.main{flex:1;margin-left:var(--side);min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:10;background:rgba(247,249,247,.94);backdrop-filter:blur(6px);display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--bd)}
.ttl{flex:1;min-width:0}
.ttl h1{font-size:20px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .mlogo{display:none;width:36px;height:36px;object-fit:contain}
.top .sub{color:var(--mut);font-size:13px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.top .acts{display:flex;gap:8px;align-items:center}
.sync{display:inline-flex;align-items:center;gap:5px}
.sync .dot{width:8px;height:8px}
#view{padding:20px 24px 40px;max-width:1400px;width:100%}
.bottom,#more{display:none}

/* ===== Thành phần ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 14px;border-radius:10px;border:1px solid var(--bd);background:#fff;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--tx)}
.btn:hover{border-color:#C9D2CC;background:#FAFBFA}
.btn.pri{background:var(--g);border-color:var(--g);color:#fff}
.btn.pri:hover{background:var(--g-d)}
.btn.ok{background:var(--g-l);border-color:#CDE5D5;color:var(--g)}
.btn.warn{background:var(--red-l);border-color:#F4C7C7;color:var(--red)}
.btn.del{color:var(--red)}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13px}
.btn.ic{width:40px;padding:0}
.btn.sm.ic{width:34px}
.btn.big{min-height:64px;font-size:16px;font-weight:600;border-radius:14px;flex-direction:column;gap:4px;padding:10px}
.btn.big svg{width:26px;height:26px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.card>.hd{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.card>.hd h2{font-size:16px;margin:0;font-weight:600}
.card>.hd .r{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card>.bd{padding:14px 16px}
.mt{margin-top:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:12px 14px;border-radius:var(--r);background:#fff;border:1px solid var(--bd);box-shadow:var(--sh);text-decoration:none;color:inherit;display:block;border-top:4px solid var(--g);min-width:0}
.kpi .l{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:26px;font-weight:700;line-height:1.2;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--mut)}
.kpi.red{border-top-color:var(--red)} .kpi.red .v{color:var(--red)}
.kpi.amb{border-top-color:#E0B000} .kpi.amb .v{color:var(--amb)}
.kpi.yel{border-top-color:var(--y)} .kpi.blu{border-top-color:var(--blu)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.b-red{background:var(--red-l);color:var(--red)} .b-amb{background:var(--amb-l);color:var(--amb)} .b-green{background:var(--g-l);color:var(--g)}
.b-gray{background:var(--gr-l);color:#4B5563} .b-out{background:#fff;color:var(--mut);border:1px dashed #C5CCC7} .b-yel{background:var(--y-l);color:#7A6400} .b-blu{background:var(--blu-l);color:var(--blu)}
.code{font-family:ui-monospace,Consolas,monospace;font-weight:700;letter-spacing:.3px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.d-red{background:var(--red)} .d-amb{background:#E0A800} .d-green{background:var(--g)} .d-gray{background:#B8BFBA}
.muted{color:var(--mut)} .small{font-size:13px}
.empty{padding:28px 16px;text-align:center;color:var(--mut)}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.sp{flex:1}
.scan-cta{display:none}

/* Bộ lọc */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.filters .search{position:relative;flex:1 1 220px}
.filters .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mut);width:18px;height:18px}
.filters .search input{padding-left:36px;width:100%}
input[type=text],input[type=date],input[type=month],input[type=search],input[type=number],input[type=time],input[type=password],input[type=email],select,textarea{min-height:40px;padding:8px 11px;border:1px solid var(--bd);border-radius:10px;background:#fff;outline:none;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(30,122,60,.15)}
input:disabled,select:disabled{background:var(--gr-l);color:var(--mut)}
.seg{display:inline-flex;background:var(--gr-l);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--mut);min-height:34px}
.seg button.on{background:#fff;color:var(--g);box-shadow:var(--sh)}
.seg.lang{flex-wrap:nowrap;flex:none}
.seg.lang button{padding:5px 10px;font-size:13px;white-space:nowrap}

/* Bảng */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);font-weight:600;padding:10px 12px;background:#FAFBFA;border-bottom:1px solid var(--bd)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--bd);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:#FBFCFB}
.tbl td a{text-decoration:none;font-weight:600;color:inherit}
.tbl .acts{white-space:nowrap;text-align:right}
.tbl .acts .btn{margin-left:4px}
.clip{max-width:300px}

/* Việc */
.task{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--bd)}
.task:last-child{border-bottom:0}
.task .t{flex:1;min-width:0}
.task .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.task .t span{font-size:13px;color:var(--mut)}
.prog{height:8px;background:var(--gr-l);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--g);border-radius:99px;transition:width .3s}
details.chk{border-bottom:1px solid var(--bd)}
details.chk:last-child{border-bottom:0}
details.chk summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 16px;font-weight:600;min-height:48px}
details.chk summary::-webkit-details-marker{display:none}
details.chk summary .chev{transition:transform .2s;color:var(--mut)}
details.chk[open] summary .chev{transform:rotate(90deg)}
.chkitems{padding:0 16px 12px;display:flex;flex-direction:column;gap:8px}
.chkitem{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;background:#FAFBFA;border-radius:10px}
.chkitem .n{flex:1 1 180px}
.chkitem .n small{display:block;color:var(--mut)}
.tog{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 14px;border-radius:99px;border:1px solid var(--bd);background:#fff;cursor:pointer;font-weight:500;font-size:13px}
.tog.on{background:var(--g);border-color:var(--g);color:#fff}
.chkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}

/* Biểu đồ */
.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end;height:170px;padding-top:10px}
.bar{display:flex;flex-direction:column;justify-content:flex-end;height:100%;align-items:center;gap:4px}
.bar .stk{width:100%;max-width:44px;display:flex;flex-direction:column-reverse;border-radius:6px 6px 0 0;overflow:hidden;min-height:2px;background:var(--gr-l)}
.bar .p1{background:var(--g)} .bar .p2{background:var(--y)}
.bar .n{font-size:12px;font-weight:600} .bar .m{font-size:12px;color:var(--mut)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* Thiết bị */
.eqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.eq{padding:14px 16px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:8px;transition:border-color .15s}
.eq:hover{border-color:var(--g)}
.eq .cd{font-size:13px;color:var(--g)}
.eq .nm{font-weight:700;font-size:16px;line-height:1.3}
.eq .ar{font-size:12.5px;color:var(--mut)}
.eq .ft{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.ico{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:var(--g-l);color:var(--g);flex:none}
.ico.ac{background:var(--blu-l);color:var(--blu)}
.info{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px 18px}
.info div small{display:block;color:var(--mut);font-size:12px}
.info div b{font-weight:600;word-break:break-word}
.tl{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--bd)}
.tl:last-child{border-bottom:0}
.tl .dt{width:92px;flex:none;font-weight:600;font-size:13px}
.tl .dt small{display:block;color:var(--mut);font-weight:400}
.tl .c{flex:1;min-width:0}
.tl .c p{margin:4px 0 0;font-size:14px}
.qrbox{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.qrbox .q{width:180px;height:180px;padding:8px;background:#fff;border:1px solid var(--bd);border-radius:12px}
.qrbox .q svg{width:100%;height:100%;display:block}
.hero{display:flex;align-items:center;gap:14px}
.hero .code{font-size:22px;color:var(--g)}
.bigacts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}

/* Lịch */
.calhd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.calhd h2{margin:0 6px;font-size:18px;min-width:150px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;background:#fff}
.cal .wd{padding:8px;font-size:12px;font-weight:600;color:var(--mut);text-align:center;background:#FAFBFA;border-bottom:1px solid var(--bd)}
.cal .c{min-height:104px;border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .c:nth-child(7n){border-right:0}
.cal .c.out{background:#FBFCFB;color:#A3AAA5}
.cal .c.sel{box-shadow:inset 0 0 0 2px var(--g)}
.cal .c .dn{font-size:13px;font-weight:600;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.cal .c.td .dn{background:var(--g);color:#fff}
.chip{font-size:11.5px;padding:2px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;border-left:3px solid}
.ch-red{background:var(--red-l);color:var(--red);border-color:var(--red)} .ch-amb{background:var(--amb-l);color:var(--amb);border-color:#E0A800}
.ch-green{background:var(--g-l);color:var(--g);border-color:var(--g)} .ch-gray{background:var(--gr-l);color:#4B5563;border-color:#B8BFBA}
.more{font-size:11.5px;color:var(--mut);padding-left:4px}
.dots{display:none;gap:3px;flex-wrap:wrap}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.week .col{background:#fff;border:1px solid var(--bd);border-radius:var(--r);min-height:220px;display:flex;flex-direction:column}
.week .col .h{padding:8px 10px;border-bottom:1px solid var(--bd);font-weight:600;font-size:13px}
.week .col.td .h{background:var(--g);color:#fff;border-radius:var(--r) var(--r) 0 0}
.week .col .b{padding:6px;display:flex;flex-direction:column;gap:4px}
.week .chip{white-space:normal;cursor:pointer}
.alert{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;background:var(--red-l);color:var(--red);margin-bottom:12px;font-weight:500}
.alert a{margin-left:auto;color:var(--red);font-weight:600}
.note{padding:10px 14px;border-radius:10px;background:var(--y-l);border-left:4px solid #E0B000;font-size:14px;margin-bottom:12px}

/* Danh mục, dữ liệu */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.dgrid .card{padding:16px;display:flex;flex-direction:column;gap:10px}
.dgrid h3{margin:0;font-size:16px;display:flex;align-items:center;gap:8px}
.dgrid p{margin:0;color:var(--mut);font-size:14px}
.dgrid .row{margin-top:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips span{display:inline-flex;align-items:center;gap:4px;background:var(--gr-l);border-radius:99px;padding:3px 4px 3px 10px;font-size:13px}
.chips span button{border:0;background:transparent;cursor:pointer;color:var(--mut);padding:0 4px;font-size:15px;line-height:1}
.grp{border-bottom:1px solid var(--bd);padding:12px 16px}
.grp:last-child{border-bottom:0}
.grp .gh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grp .gh b{font-size:15px}
.grp ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.grp li{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#FAFBFA;border-radius:8px;font-size:14px;flex-wrap:wrap}
.grp li .tk{flex:1 1 200px;min-width:0}
.grp li .tk small{display:block;color:var(--mut)}

/* Hộp thoại */
dialog{border:0;border-radius:16px;padding:0;width:min(660px,calc(100vw - 32px));max-height:calc(100vh - 40px);box-shadow:0 20px 50px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(17,24,39,.5)}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 40px)}
.dlg .hd{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--bd);gap:10px}
.dlg .hd h3{margin:0;font-size:17px}
.dlg .hd .btn{margin-left:auto;border:0}
.dlg .bd{padding:16px 18px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.dlg .ft{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--bd)}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:13px;font-weight:600}
.fld label .rq{color:var(--red)}
.fld input,.fld select,.fld textarea{width:100%}
.fld textarea{min-height:80px;resize:vertical}
.fld .err{color:var(--red);font-size:12.5px;display:none}
.fld.bad .err{display:block}
.fld.bad input,.fld.bad select,.fld.bad textarea{border-color:var(--red)}
.fld .hint{font-size:12px;color:var(--mut)}
.sect{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--g);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--bd);padding-bottom:4px;margin-top:4px}
.pchips{display:flex;gap:6px;flex-wrap:wrap}
.pchips button{border:1px solid var(--bd);background:#fff;border-radius:99px;padding:4px 10px;font-size:13px;cursor:pointer;min-height:32px}
.pchips button:hover{border-color:var(--g);color:var(--g)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#1F2937;color:#fff;padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:200;font-weight:500;max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Quét QR */
.scanbox .vid{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:1/1;max-height:60vh;margin:0 auto;width:100%}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanbox .frame{position:absolute;inset:18%;border:3px solid var(--y);border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.scanbox .bd{display:block}
.scanbox .bd>*+*{margin-top:12px}

/* Đăng nhập */
#login{position:fixed;inset:0;z-index:150;background:var(--bg);display:grid;place-items:center;padding:16px}
#login[hidden]{display:none}
#login .box{width:min(400px,100%);padding:28px 24px}
#login .box img{width:84px;display:block;margin:0 auto 6px}
#login h2{text-align:center;margin:0 0 2px;color:var(--g);font-size:20px}
#login .sub{text-align:center;color:var(--mut);margin-bottom:18px;font-size:14px}
#login .fld{margin-bottom:12px}
#login .msg{color:var(--red);font-size:13.5px;min-height:20px;margin-bottom:8px}
#login .btn{width:100%}

#print{display:none}

/* ===== Tablet ===== */
@media (max-width:1023px){
  :root{--side:76px}
  .brand{justify-content:center;padding:12px 8px}
  .brand div,.nav a span,.side .foot .u{display:none}
  .side .foot{justify-content:center}
  .nav a{justify-content:center;padding:12px 0;position:relative}
  .nav a .cnt{position:absolute;top:4px;right:8px;margin:0}
  .g2{grid-template-columns:minmax(0,1fr)}
  .tbl .hide-t,.tbl .lbl{display:none}
  .tbl .acts .btn{width:34px;padding:0}
  #view{padding:16px}
  .top{padding:12px 16px}
}
/* ===== Điện thoại ===== */
@media (max-width:767px){
  .side{display:none}
  .main{margin-left:0}
  .top{gap:8px;padding:10px 12px}
  .top .mlogo{display:block}
  .ttl h1{font-size:17px}
  .top .syt,.hide-m{display:none!important}
  .seg.lang button{padding:4px 8px;font-size:12px;min-height:32px}
  .task{padding:11px 14px;align-items:flex-start}
  .task .dot{margin-top:7px}
  .task .lbl{display:none}
  .task .btn{width:42px;height:42px;padding:0}
  #view{padding:12px 12px 100px}
  .scan-cta{display:flex;width:100%;margin-bottom:12px}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bd);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
  .bottom a,.bottom button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11px;color:var(--mut);text-decoration:none;font-weight:500;min-height:58px;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:none;border:0;cursor:pointer}
  .bottom .on{color:var(--g)}
  .bottom .cnt{position:absolute;top:4px;left:calc(50% + 6px);background:var(--red);color:#fff;border-radius:99px;font-size:10px;padding:0 5px;font-weight:600}
  .bottom .scanb{overflow:visible}
  .bottom .scanb span{width:56px;height:56px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;margin-top:-26px;box-shadow:0 6px 16px rgba(30,122,60,.45);border:4px solid #fff}
  .bottom .scanb span svg{width:26px;height:26px}
  .bottom .scanb{color:var(--g);font-weight:700}
  #more{position:fixed;right:10px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:40;background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;min-width:210px}
  #more.open{display:block}
  #more a,#more button{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;text-decoration:none;color:var(--tx);font-weight:500;background:none;border:0;width:100%;cursor:pointer;font-size:15px}
  #more a.on{background:var(--g-l);color:var(--g)}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi .v{font-size:22px}
  .filters>*{flex:1 1 140px}
  .filters .search{flex:1 1 100%}
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr{padding:10px 14px;border-bottom:1px solid var(--bd)}
  .tbl td{border:0;padding:3px 0;display:flex;gap:10px}
  .tbl td::before{content:attr(data-l);flex:0 0 108px;color:var(--mut);font-size:13px}
  .tbl td.main-c{font-weight:700;font-size:15px}
  .tbl td.main-c::before,.tbl td.acts::before{display:none}
  .tbl td.acts{justify-content:flex-end;padding-top:8px}
  .tbl .hide-t{display:flex}
  .clip{max-width:none}
  .cal .c{min-height:58px;padding:4px;align-items:center}
  .cal .c .chip,.cal .c .more{display:none}
  .cal .c .dots{display:flex;justify-content:center}
  .cal .c .dots .dot{width:7px;height:7px}
  .week{grid-template-columns:1fr}
  .week .col{min-height:0}
  .dlg .bd{grid-template-columns:1fr}
  dialog{width:100vw;max-width:100vw;max-height:100dvh;height:100dvh;margin:0;border-radius:0}
  .dlg{max-height:100dvh;height:100%}
  .dlg .bd{flex:1}
  .chkgrid{grid-template-columns:1fr}
  .tl .dt{width:76px}
  .bigacts{grid-template-columns:1fr}
  .qrbox .q{width:150px;height:150px}
}

/* ===== In ===== */
@media print{
  body{background:#fff}
  .app,.bottom,#more,dialog,#toast,#login{display:none!important}
  #print{display:block;font-size:12px;color:#000}
  #print table{width:100%;border-collapse:collapse;margin-top:8px}
  #print th,#print td{border:1px solid #999;padding:4px 6px;text-align:left;vertical-align:top}
  #print th{background:#E7F3EB}
  #print h1{font-size:18px;margin:6px 0;color:#14592A;text-align:center}
  #print .ph{display:flex;align-items:center;gap:12px;border-bottom:2px solid #1E7A3C;padding-bottom:8px}
  #print .ph img{width:56px}
  #print .sign{display:flex;justify-content:space-around;margin-top:30px;text-align:center}
  #print .labels{display:grid;grid-template-columns:repeat(3,1fr)}
  #print .lab{height:37mm;border:1px dashed #9AA;display:flex;align-items:center;gap:3mm;padding:2.5mm 3mm;break-inside:avoid;overflow:hidden}
  #print .lab .lq{width:31mm;height:31mm;flex:none}
  #print .lab .lq svg{width:100%;height:100%;display:block}
  #print .lab .li{min-width:0;display:flex;flex-direction:column;gap:1mm}
  #print .lab .li img{width:12mm}
  #print .lab .li b{font-size:13pt;font-family:Consolas,monospace;color:#14592A}
  #print .lab .li span{font-size:8.5pt;font-weight:600;line-height:1.2}
  #print .lab .li small{font-size:7.5pt;color:#444}
  @page{size:A4;margin:10mm}
}
</style>

/* Áp kế hoạch mẫu của nhóm cho từng máy trong nhóm */
function syncTemplates(d = db) {
  const keep = new Set();

    let p = d.plans.find(x => x.tplId === tp.id && x.equipId === e.id);

async function doLogin(login, password) {

  if (!snap.exists) {
    /* Lần đầu: chưa có Admin nào thì đăng nhập Admin / 123456 sẽ tạo tài khoản Admin */
    if (login === DEFAULT_ADMIN.login && password === DEFAULT_ADMIN.password && !(await hasAnyAdmin())) {

/* =====================================================================
   12. LỊCH
   ===================================================================== */
function calEvents(start, end) {
  const T = today(), out = [];
  db.plans.forEach(p => {
    if (isDaily(p) || (!ui.cal.short && p.unit !== 'tháng')) return;
    const e = eqById(p.equipId); if (!e) return;
    let d = planInfo(p, T).due, n = 0; if (!d) return;
    while (d <= end && n++ < 400) { if (d >= start) { const df = diffDays(T, d); out.push({ date: d, st: df < 0 ? 'overdue' : df === 0 ? 'today' : df <= 7 ? 'soon' : 'ok', title: p.task, eq: e.code, plan: p.id }); } d = nextDate(d, p); }
  });
  db.logs.forEach(l => { if (l.date >= start && l.date <= end) out.push({ date: l.date, st: 'done', title: l.task, eq: eqById(l.equipId)?.code || '', log: l.id, type: l.type }); });
  const ord = { overdue: 0, today: 1, soon: 2, ok: 3, done: 4 };

function calBody() {
  const c = ui.cal, T = today(), ref = parse(c.ref);
  if (c.mode === 'month') {
    const first = new Date(ref.getFullYear(), ref.getMonth(), 1), st = new Date(first); st.setDate(1 - ((first.getDay() + 6) % 7));

    $('#calb').innerHTML = `<div class="cal">${h}</div>`; calDay(by[c.sel] || []);

    $('#calday').innerHTML = '';
  }
}

function nextCode(groupId) {
  const g = grpById(groupId); if (!g) return '';
  const pre = g.prefix + '-', nums = db.equipment.map(e => e.code).filter(c => c.startsWith(pre)).map(c => +c.slice(pre.length) || 0);
  const n = Math.max(0, ...nums) + 1; return pre + pad(n, Math.max(2, String(n).length));
}

function grpForm(gid) {

document.addEventListener('click', e => {

    case 'plan-edit': planForm(d.id); break;
    case 'plan-del': if (confirm(t('Xóa kế hoạch này? (Nhật ký đã ghi vẫn được giữ)'))) { db.plans = db.plans.filter(x => x.id !== d.id); save(); render(); } break;

    case 'eq-del': { const eq = eqById(d.id); if (confirm(t('Xóa thiết bị {c}?\nSẽ xóa luôn kế hoạch và {n} phiếu của máy này. Nếu máy ngưng dùng, nên chọn trạng thái "Thanh lý" thay vì xóa.', { c: eq.code, n: db.logs.filter(l => l.equipId === d.id).length }))) {
      db.equipment = db.equipment.filter(x => x.id !== d.id); db.plans = db.plans.filter(p => p.equipId !== d.id); db.logs = db.logs.filter(l => l.equipId !== d.id); save(); location.hash = '#/thietbi'; toast(t('Đã xóa thiết bị')); } break; }

    case 'print-labels': printLabels(filteredEq()); break;
    case 'grp-new': grpForm(); break;
    case 'grp-edit': grpForm(d.id); break;
    case 'grp-del': { const n = db.equipment.filter(x => x.groupId === d.id).length; if (n) { toast(t('Nhóm còn {n} thiết bị, không xóa được', { n })); break; } if (confirm(t('Xóa nhóm máy này và các hạng mục mẫu của nhóm?'))) { db.groups = db.groups.filter(x => x.id !== d.id); db.tpls = db.tpls.filter(x => x.groupId !== d.id); save(); render(); } break; }

    case 'cal-day': if (e.target.closest('.chip')) break; c.sel = d.d; calBody(); break;
  }
